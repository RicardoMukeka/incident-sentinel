# application-dev.properties — perfil pensado pra rodar local contra um ambiente de staging.
# Usa ${ENV_VAR} como o arquivo base — os valores reais (host do MySQL, SIGNOZ_API_BASE_URL,
# TSURU_TOKEN/TARGET, tópicos do Pub/Sub, GOOGLE_CLOUD_PROJECT etc.) precisam ser preenchidos
# por quem tem acesso a esses ambientes; nenhum valor real foi inventado aqui.

spring.application.name=incidentsentinel
server.port=${SERVER_PORT:8888}

# Timezone único — evita fronteira de "dia" divergente entre JVM e MySQL perto da meia-noite
# (docs/ARCHITECTURE.md). Datas de dia/dedup continuam bindadas como parâmetro pela JVM
# (LocalDate.now(ZoneOffset.UTC)), nunca CURRENT_DATE/NOW() server-side.
spring.jackson.time-zone=UTC

# Virtual threads — sistema I/O-bound (HTTP SigNoz, subprocesso STDIO Tsuru, chamadas LLM de vários
# segundos). Primeira vez no ecossistema do time (nenhum app irmão usa ainda,
# ver docs/ARCHITECTURE.md).
spring.threads.virtual.enabled=true

# useAffectedRows=true garante que INSERT...ON DUPLICATE KEY UPDATE retorne 1 (insert) vs 2 (update),
# do que TicketRepository.upsertOcorrencia depende (docs/ARCHITECTURE.md — Liquibase).
spring.datasource.url=jdbc:mysql://${SPRING_DATASOURCE_HOST}/${SPRING_DATASOURCE_DB}?connectionTimeZone=UTC&useAffectedRows=true
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.generate-ddl=false
spring.jpa.open-in-view=false

spring.liquibase.change-log=classpath:db/changelog-master.xml
spring.liquibase.enabled=${SPRING_LIQUIBASE_ENABLED:true}

# Graceful shutdown — investigação em voo não pode ser abortada por SIGTERM de deploy rolling
# PENDÊNCIA (docs/ARCHITECTURE.md): 60s é só ponto de partida — calibrar
# contra o p99 REAL de uma investigação, medido rodando de verdade contra STG.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=60s

# maxAckExtensionPeriod precisa cobrir o mesmo p99 acima — sem essa folga, redelivery em
# investigação ainda em voo gera 2 chamadas de LLM concorrentes de verdade, que orcamento_debitado
# (docs/ARCHITECTURE.md) sozinho não impede (só evita contar o orçamento 2x, não impede a 2ª execução
# de rodar). Nome da property confirmado via javap contra o jar real
# (com.google.cloud.spring.pubsub.core.PubSubConfiguration$Subscriber, campo Long em segundos —
# não usa sintaxe "60s" de Duration, é um número puro). Mesma pendência de calibração do bloco acima.
spring.cloud.gcp.pubsub.subscriber.max-ack-extension-period=60

management.endpoints.web.base-path=/
management.endpoints.web.path-mapping.health=healthcheck
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}

signoz.api.base-url=${SIGNOZ_API_BASE_URL}
signoz.api.token=${SIGNOZ_API_TOKEN}

incidentsentinel.investigation.daily-budget=${INVESTIGATION_DAILY_BUDGET:5}
incidentsentinel.investigation.daily-cost-cap-usd=${INVESTIGATION_DAILY_COST_CAP_USD:1.00}
incidentsentinel.investigation.enabled=${INVESTIGATION_ENABLED:true}
incidentsentinel.investigation.trace-max-spans=${INVESTIGATION_TRACE_MAX_SPANS:40}
incidentsentinel.investigation.log-max-entries=${INVESTIGATION_LOG_MAX_ENTRIES:50}
incidentsentinel.investigation.log-window=${INVESTIGATION_LOG_WINDOW:15m}
incidentsentinel.investigation.prompt-max-chars=${INVESTIGATION_PROMPT_MAX_CHARS:20000}
incidentsentinel.investigation.retriever-timeout=${INVESTIGATION_RETRIEVER_TIMEOUT:25s}
incidentsentinel.investigation.llm-timeout=${INVESTIGATION_LLM_TIMEOUT:60s}

incidentsentinel.pricing.models.gemini-2.0-flash.input-per-1m-usd=${GEMINI_FLASH_INPUT_USD:0.10}
incidentsentinel.pricing.models.gemini-2.0-flash.output-per-1m-usd=${GEMINI_FLASH_OUTPUT_USD:0.40}

incidentsentinel.gcp.logging.projects=${GCP_LOGGING_PROJECTS}
incidentsentinel.gcp.logging.resource-type=${GCP_LOGGING_RESOURCE_TYPE:k8s_container}

incidentsentinel.collector.trigger-secret=${COLLECTOR_TRIGGER_SECRET}
incidentsentinel.collector.watermark-overlap=${COLLECTOR_WATERMARK_OVERLAP:30s}
incidentsentinel.collector.watermark-fallback-window=${COLLECTOR_WATERMARK_FALLBACK:1h}
incidentsentinel.collector.watermark-max-lookback=${COLLECTOR_WATERMARK_MAX_LOOKBACK:24h}
# docs/ARCHITECTURE.md: threshold deliberadamente indefinido na spec ("a definir do zero, sem SLO
# prévio") — 2s é só um chute de partida, calibrar contra a baseline real em STG antes de confiar.
incidentsentinel.collector.latency-threshold=${COLLECTOR_LATENCY_THRESHOLD:2s}

resilience4j.retry.instances.signoz.max-attempts=3
resilience4j.retry.instances.signoz.wait-duration=500ms
resilience4j.circuitbreaker.instances.signoz.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.signoz.sliding-window-size=10

resilience4j.retry.instances.tsuru-mcp.max-attempts=2
resilience4j.retry.instances.tsuru-mcp.wait-duration=1s
resilience4j.circuitbreaker.instances.tsuru-mcp.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.tsuru-mcp.sliding-window-size=5

resilience4j.retry.instances.gcp-logging.max-attempts=2
resilience4j.retry.instances.gcp-logging.wait-duration=1s
resilience4j.circuitbreaker.instances.gcp-logging.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.gcp-logging.sliding-window-size=5

resilience4j.retry.instances.vertex-ai.max-attempts=2
resilience4j.retry.instances.vertex-ai.wait-duration=2s
resilience4j.circuitbreaker.instances.vertex-ai.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.vertex-ai.sliding-window-size=5

spring.cloud.gcp.pubsub.incidentsentinel.novo-erro.topic=${PUBSUB_NOVO_ERRO_TOPIC}
spring.cloud.gcp.pubsub.incidentsentinel.novo-erro.subscription=${PUBSUB_NOVO_ERRO_SUBSCRIPTION}
spring.cloud.gcp.pubsub.incidentsentinel.novo-erro.dlt.subscription=${PUBSUB_NOVO_ERRO_DLT_SUBSCRIPTION}

spring.ai.google.genai.project-id=${GOOGLE_CLOUD_PROJECT}
spring.ai.google.genai.location=${VERTEX_AI_LOCATION:us-central1}
spring.ai.google.genai.chat.model=${VERTEX_AI_GEMINI_MODEL:gemini-2.0-flash}
spring.ai.google.genai.chat.temperature=${VERTEX_AI_GEMINI_TEMPERATURE:0.15}

# MCP Tsuru — ÚNICO MCP (docs/ARCHITECTURE.md).
spring.ai.mcp.client.stdio.connections.tsuru.command=${TSURU_MCP_BINARY:tsuru-mcp}
spring.ai.mcp.client.stdio.connections.tsuru.env.TSURU_TOKEN=${TSURU_TOKEN}
spring.ai.mcp.client.stdio.connections.tsuru.env.TSURU_TARGET=${TSURU_TARGET}
spring.ai.mcp.client.stdio.connections.tsuru.env.READ_ONLY=true
